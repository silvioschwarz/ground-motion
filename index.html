<!doctype html>
<!-- Code from d3-graph-gallery.com -->
<html lang="de">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ground Motion Dashboard</title>
  <script src="https://d3js.org/d3.v4.js"></script>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:,">

  <!-- 2. Eigene Module in logischer Reihenfolge laden -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/charts/scatterPlot.js"></script>
  <script src="js/charts/histogram.js"></script>
  <script src="js/charts/densityPlot.js"></script>
  <script src="js/charts/dashboard.js"></script>
  <script src="js/main.js"></script>


</head>

<body>
  <header>
    <h1>Ground Motion Dashboard</h1>
  </header>

  <main>
    <div class="left-column">
      <!-- 0. Lokale CSV-Datei von der Festplatte laden -->
      <div class="file-upload-box">
        <label for="csv-file-input" style="font-weight: bold; cursor: pointer">
          CSV-Datei von Festplatte laden:
        </label>
        <input type="file" id="csv-file-input" accept=".csv,text/csv" autocomplete="off" />
        <span id="file-status">Versuche Standarddatei (/NGA_West2.csv) zu laden...</span>
        <div id="data-sources" style="margin-top: 10px; font-size: 14px; color: #555">
          <strong>Verfügbare Datenquellen:</strong><br />
          <label style="font-weight: bold; margin-right: 15px; cursor: pointer">
            <input type="checkbox" id="nga-west2-checkbox" checked autocomplete="off" class="data" />
            NGA_West2
          </label>
          <label style="font-weight: bold; margin-right: 15px; cursor: pointer">
            <input type="checkbox" id="esm-checkbox" autocomplete="off" class="data" />
            ESM
          </label>
        </div>
      </div>
      <!-- 1. Magnituden-Slider + Live-Anzeige -->
      <div class="control-group">
        <label for="mag-slider" style="font-weight: bold">
          Min. Magnitude: <span id="mag-value">0.0</span>
        </label>
        <span id="visible-count" style="margin-left: 20px; color: #555; font-size: 14px"></span>
        <br />
        <input type="range" id="mag-slider" min="0" max="9.5" step="0.1" value="0" autocomplete="off"
          style="width: 300px; cursor: pointer" />
      </div>


      <!-- 2. Checkboxen für Log-Skalen & Trendlinie -->
      <div class="control-group">
        <label style="font-weight: bold; margin-right: 15px; cursor: pointer">
          <input type="checkbox" id="log-x-checkbox" checked autocomplete="off" />
          Log X-Achse (Distanz)
        </label>
        <label style="font-weight: bold; margin-right: 15px; cursor: pointer">
          <input type="checkbox" id="log-y-checkbox" checked autocomplete="off" />
          Log Y-Achse (PGA)
        </label>
        <label style="font-weight: bold; color: #0056b3; cursor: pointer">
          <input type="checkbox" id="trendline-checkbox" checked autocomplete="off" />
          Trendlinie anzeigen
        </label>
        <span id="trendline-stats" style="margin-left: 15px; font-size: 13px; color: #333"></span>
      </div>

      <!-- 3. Radio Buttons für die X-Achsen-Metrik -->
      <div>
        <ul>
          <li>
            <label style="cursor: pointer"><input type="radio" name="distance" value="HypD (km)" checked
                autocomplete="off" />
              HypD (km)</label>
          </li>
          <li>
            <label style="cursor: pointer;"><input type="radio" name="distance" value="EpiD (km)" autocomplete="off" />
              EpiD (km)</label>
          </li>
          <li>
            <label style="cursor: pointer;"><input type="radio" name="distance" value="Joyner-Boore Dist. (km)"
                autocomplete="off" />
              Joyner-Boore Dist. (km)</label>
          </li>
        </ul>
      </div>

    </div>

    <!-- Dashboard Bereich: Links Hauptplot, Rechts Histogramm + Density -->


    <div class="middle-column">
      <div id="my_dataviz">
      </div>
    </div>

    <div class="right-column">

      <div id="mag_histogram"></div>

      <div id="pga_density"></div>
    </div>
  </main>

  <footer>
    <p style="text-align: center; font-size: 12px; color: #555">
      &copy; 2026 Ground Motion Dashboard. All rights reserved. @Sufferwell, Silvio.
      <a href="https://github.com/SilvioSuffer/ground-motion" target="_blank"
        style="color: #0056b3; text-decoration: underline;">
        GitHub Repository
      </a>
    </p>
  </footer>
  <script src="js/main.js" type="module"></script>
</body>

</html>
